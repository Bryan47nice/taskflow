<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1f2937;
      margin: 0;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      color: #4f46e5;
    }
    .subtitle {
      color: #6b7280;
      font-size: 12px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .hint {
      color: #6b7280;
      font-size: 11px;
      margin: 0 0 6px;
    }
    textarea {
      width: 100%;
      height: 90px;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
      outline: none;
    }
    textarea:focus { border-color: #4f46e5; }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    .status {
      font-size: 11px;
      color: #10b981;
    }
    button {
      padding: 6px 14px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
</head>
<body>
  <h2>TaskFlow Capture</h2>
  <p class="subtitle">Google Chat @mention 自動偵測設定</p>

  <label>監看的 @mention 清單</label>
  <p class="hint">每行一個，含有這些 mention 的訊息會出現「加入 TaskFlow」按鈕</p>
  <textarea id="mentions" placeholder="@all&#10;@你的名字"></textarea>

  <div class="footer">
    <span class="status" id="status"></span>
    <button id="btn-save">儲存</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
